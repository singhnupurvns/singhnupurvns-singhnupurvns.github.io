<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nupur Singh — Generative AI Engineer</title>
<style>
  :root{
    --bg: #0b1220;
    --bg-soft: #101a2e;
    --text: #eaf0fb;
    --muted: #8ea0c2;
    --accent: #4fd1c5;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
  }

  /* ---------- INTRO / VIDEO STAGE ---------- */
  #intro{
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
    transition: opacity 0.9s ease;
  }
  #intro.fade-out{ opacity: 0; pointer-events: none; }

  #intro video{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  #skip-btn{
    position: absolute;
    bottom: 28px;
    right: 28px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.35);
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  #skip-btn:hover{
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.6);
  }

  /* ---------- MAIN PORTFOLIO STAGE ---------- */
  #portfolio{
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 80px;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  #portfolio.reveal{
    opacity: 1;
    transform: translateY(0);
  }

  .eyebrow{
    color: var(--accent);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 12px;
    margin-bottom: 10px;
  }

  h1{
    font-size: clamp(24px, 4vw, 34px);
    margin: 0 0 6px;
    text-align: center;
  }

  p.sub{
    color: var(--muted);
    text-align: center;
    max-width: 640px;
    margin: 0 0 34px;
    font-size: 15px;
    line-height: 1.5;
  }

  .frame{
    width: 100%;
    max-width: 1000px;
    background: var(--bg-soft);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
  }

  .frame img{
    width: 100%;
    display: block;
    border-radius: 10px;
  }

  footer{
    margin-top: 36px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  footer a{
    color: var(--accent);
    text-decoration: none;
  }
  footer a:hover{ text-decoration: underline; }

  @media (prefers-reduced-motion: reduce){
    #intro, #portfolio{ transition: none; }
  }
</style>
</head>
<body>

  <!-- Intro video stage -->
  <div id="intro">
    <video id="intro-video" autoplay muted playsinline>
      <source src="video.mp4" type="video/mp4">
    </video>
    <button id="skip-btn">Skip intro →</button>
  </div>

  <!-- Portfolio stage (revealed after the video ends) -->
  <div id="portfolio">
    <div class="eyebrow">Portfolio</div>
    <h1>Nupur Singh</h1>
    <p class="sub">Generative AI Engineer &amp; Agentic AI Systems Architect — building production-grade, deterministic, and safe AI pipelines.</p>
    <div class="frame">
      <img src="port.png" alt="Nupur Singh — Generative AI Engineer portfolio summary">
    </div>
    <footer>
      GitHub: <a href="https://github.com/singhnupurvns" target="_blank" rel="noopener">github.com/singhnupurvns</a>
    </footer>
  </div>

<script>
  const introEl = document.getElementById('intro');
  const portfolioEl = document.getElementById('portfolio');
  const video = document.getElementById('intro-video');
  const skipBtn = document.getElementById('skip-btn');

  function revealPortfolio(){
    introEl.classList.add('fade-out');
    portfolioEl.classList.add('reveal');
    setTimeout(() => { introEl.style.display = 'none'; }, 950);
  }

  video.addEventListener('ended', revealPortfolio);
  skipBtn.addEventListener('click', revealPortfolio);

  // Fallback in case autoplay is blocked: show portfolio after a short wait
  video.addEventListener('error', revealPortfolio);
</script>

</body>
</html>
